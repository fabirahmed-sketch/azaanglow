<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Azaan Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans Bengali',system-ui,sans-serif;background:#f4f7ee;color:#14160f}
.inp{width:100%;border:1px solid #d4d8cc;border-radius:.6rem;padding:.55rem .75rem;background:#fff;font-size:.9rem}
.inp:focus{outline:2px solid #8dc63f;border-color:#8dc63f}
.btn{background:#8dc63f;color:#14160f;font-weight:700;border-radius:.6rem;padding:.55rem 1rem;font-size:.9rem}
.btn:hover{background:#14160f;color:#fff}.btn2{border:1px solid #c9cfbd;border-radius:.6rem;padding:.45rem .8rem;font-size:.85rem;background:#fff}
.btn2:hover{border-color:#14160f}.red{color:#b91c1c}.card{background:#fff;border:1px solid #e3e7da;border-radius:1rem}
.tab.on{background:#14160f;color:#fff}</style>
</head>
<body>
<div id="login" class="min-h-screen grid place-items-center p-4">
  <form id="loginForm" class="card p-6 w-full max-w-sm space-y-3">
    <h1 class="text-xl font-bold">Azaan এডমিন লগইন</h1>
    <input id="lEmail" type="email" class="inp" placeholder="ইমেইল" required autocomplete="username">
    <input id="lPass" type="password" class="inp" placeholder="পাসওয়ার্ড" required autocomplete="current-password">
    <p id="lErr" class="text-sm red"></p>
    <button class="btn w-full">লগইন</button>
  </form>
</div>

<div id="app" class="hidden">
  <header class="bg-white border-b sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-3 py-2 flex items-center gap-2">
      <b class="text-lg">Azaan Admin</b>
      <button data-act="sound" id="soundBtn" class="btn2 ml-auto">🔔 সাউন্ড বন্ধ</button>
      <button data-act="logout" class="btn2">লগআউট</button>
    </div>
    <nav id="tabs" class="max-w-6xl mx-auto px-3 pb-2 flex gap-2 overflow-x-auto text-sm font-semibold"></nav>
  </header>
  <main id="view" class="max-w-6xl mx-auto p-3 sm:p-4"></main>
</div>

<div id="modal" class="hidden fixed inset-0 z-50 bg-black/50 overflow-y-auto p-3"><div id="modalBox" class="card max-w-2xl mx-auto my-6 p-5"></div></div>
<div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-black text-white text-sm px-4 py-2 rounded-full z-[60]"></div>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, getDoc, query, orderBy, serverTimestamp, increment, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(window.FIREBASE_CONFIG), auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const tk = n => bn((+n || 0).toLocaleString('en-US')) + '৳';
const dt = t => t?.toDate ? t.toDate().toLocaleString('bn-BD', {dateStyle:'medium', timeStyle:'short'}) : '…';
const toast = (m, ms = 2500) => { const t = $('#toast'); t.textContent = m; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), ms); };
const ST = { pending:['পেন্ডিং','bg-yellow-100 text-yellow-800'], confirmed:['কনফার্ম','bg-blue-100 text-blue-800'], shipped:['শিপড','bg-purple-100 text-purple-800'], delivered:['ডেলিভারড','bg-green-100 text-green-800'], cancelled:['ক্যান্সেল','bg-red-100 text-red-800'] };
const badge = s => `<span class="px-2 py-0.5 rounded-full text-xs font-bold ${ST[s]?.[1] || ''}">${ST[s]?.[0] || s}</span>`;
const TABS = [['dash','ড্যাশবোর্ড'],['products','প্রোডাক্ট'],['sections','ফিচারড সেকশন ও ক্যাটাগরি'],['home','হোমপেজ সেকশন'],['brands','ব্র্যান্ড'],['orders','অর্ডার'],['customers','কাস্টমার'],['promos','প্রমো কোড'],['banners','ব্যানার'],['offers','অফার আইকন'],['popups','পপআপ এড'],['settings','সেটিংস']];

const D = { products:[], orders:[], promos:[], banners:[], settings:{} };
let tab = 'dash', oFilter = 'all', oSearch = '', pSearch = '', secQ = {}, autoBusy = false, form = {}, soundOn = false, firstLoad = {}, unsubs = [];

/* ---------- Auth ---------- */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#lErr').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('#lEmail').value.trim(), $('#lPass').value); }
  catch { $('#lErr').textContent = 'ইমেইল বা পাসওয়ার্ড ভুল।'; }
});
onAuthStateChanged(auth, u => {
  $('#login').classList.toggle('hidden', !!u); $('#app').classList.toggle('hidden', !u);
  unsubs.forEach(f => f()); unsubs = []; firstLoad = {};
  if (u) { listen('products'); listen('orders', 'createdAt'); listen('promos'); listen('banners'); listenSettings(); }
});
function listen(name, ord) {
  const q = ord ? query(collection(db, name), orderBy(ord, 'desc')) : collection(db, name);
  unsubs.push(onSnapshot(q, s => {
    D[name] = s.docs.map(d => ({ ...d.data(), id: d.id }));
    if (name === 'orders' && firstLoad.orders && soundOn && s.docChanges().some(c => c.type === 'added')) { beep(); toast('🛒 নতুন অর্ডার এসেছে!'); }
    firstLoad[name] = true; if (name === 'products') { hadProducts ||= D.products.length > 0; schedSync(); } render(); autoBestRun();
  }, err => toast('ডাটা লোড হয়নি: ' + err.code)));
}
function listenSettings() { unsubs.push(onSnapshot(doc(db, 'settings', 'main'), s => { D.settings = s.data() || {}; render(); autoBestRun(); })); }
function beep() { try { const c = new AudioContext(), o = c.createOscillator(); o.connect(c.destination); o.frequency.value = 880; o.start(); setTimeout(() => { o.stop(); c.close(); }, 350); } catch {} }

/* ---------- Image helper (ছবি ছোট করে Firestore এ রাখা হয়, আলাদা স্টোরেজ লাগে না) ---------- */
const fileToData = (f, max = 900, q = .8) => new Promise((ok, no) => {
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', q)); }; im.onerror = no; im.src = r.result; };
  r.onerror = no; r.readAsDataURL(f);
});

/* ---------- Cloudinary ছবি আপলোড (ছবি Cloudinary তে থাকে, ডাটাবেসে শুধু লিংক) ---------- */
const CLD = { cloud: 'vapfnr6g', preset: 'azaan_products' };
const toBlob = (f, max = 1200, q = .85) => new Promise((ok, no) => {
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); c.toBlob(b => b ? ok(b) : no(new Error('blob')), 'image/jpeg', q); }; im.onerror = no; im.src = r.result; };
  r.onerror = no; r.readAsDataURL(f);
});
async function uploadCld(file) {
  const fd = new FormData(); fd.append('file', typeof file === 'string' ? file : await toBlob(file)); fd.append('upload_preset', CLD.preset);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLD.cloud}/image/upload`, { method: 'POST', body: fd });
  const j = await res.json(); if (!res.ok || !j.secure_url) throw new Error(j.error?.message || 'upload failed');
  return j.secure_url.replace('/upload/', '/upload/f_auto,q_auto,w_800/');
}

/* ---------- Modal ---------- */
const openModal = h => { $('#modalBox').innerHTML = h; $('#modal').classList.remove('hidden'); };
const closeModal = () => $('#modal').classList.add('hidden');
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });

/* ---------- Views ---------- */
function render() {
  $('#tabs').innerHTML = TABS.map(([k, n]) => `<button data-act="tab" data-v="${k}" class="tab shrink-0 px-3 py-1.5 rounded-full border bg-white ${tab === k ? 'on' : ''}">${n}${k === 'orders' && D.orders.filter(o => o.status === 'pending').length ? ` (${bn(D.orders.filter(o => o.status === 'pending').length)})` : ''}</button>`).join('');
  $('#view').innerHTML = ({ dash: vDash, products: vProducts, sections: vSections, home: vHome, brands: vBrands, orders: vOrders, customers: vCustomers, promos: vPromos, banners: vBanners, offers: vOffers, popups: vPopups, settings: vSettings })[tab]();
}
function vDash() {
  const today = new Date().toDateString(), live = D.orders.filter(o => o.status !== 'cancelled');
  const tod = D.orders.filter(o => o.createdAt?.toDate && o.createdAt.toDate().toDateString() === today);
  const low = D.products.filter(p => p.active !== false && (+p.stock || 0) <= 5);
  const box = (t, v) => `<div class="card p-4"><p class="text-xs text-black/60">${t}</p><p class="text-2xl font-bold mt-1">${v}</p></div>`;
  return `<div class="grid grid-cols-2 md:grid-cols-4 gap-3">
    ${box('আজকের অর্ডার', bn(tod.length))}${box('আজকের বিক্রি', tk(tod.filter(o => o.status !== 'cancelled').reduce((a, o) => a + o.total, 0)))}
    ${box('পেন্ডিং অর্ডার', bn(D.orders.filter(o => o.status === 'pending').length))}${box('মোট বিক্রি', tk(live.reduce((a, o) => a + o.total, 0)))}</div>
  <div class="grid md:grid-cols-2 gap-3 mt-3">
    <div class="card p-4"><h3 class="font-bold mb-2">সর্বশেষ অর্ডার</h3>${D.orders.slice(0, 6).map(o => `<button data-act="order" data-id="${o.id}" class="w-full flex justify-between items-center py-2 border-b text-left text-sm"><span>${esc(o.orderNo)} · ${esc(o.name)}</span><span>${tk(o.total)} ${badge(o.status)}</span></button>`).join('') || '<p class="text-sm text-black/50">এখনো অর্ডার নেই</p>'}</div>
    <div class="card p-4"><h3 class="font-bold mb-2">স্টক কম (৫ বা কম)</h3>${low.map(p => `<button data-act="pedit" data-id="${p.id}" class="w-full flex justify-between py-2 border-b text-sm text-left"><span>${esc(p.name)}</span><b class="${+p.stock <= 0 ? 'red' : ''}">${bn(+p.stock || 0)}</b></button>`).join('') || '<p class="text-sm text-black/50">সব প্রোডাক্টের স্টক ঠিক আছে</p>'}</div>
  </div>`;
}
/* ---------- ওয়েবসাইটের ফিচারড সেকশন ---------- */
const SECTIONS = [['best', '★ বেস্ট সেলিং প্রোডাক্টস', '★ বেস্ট'], ['sandalwood', 'চন্দন কালেকশন (Sandalwood)', 'চন্দন'], ['bamboo', 'বাম্বু কালেকশন (Bamboo Wood)', 'বাম্বু']];
const HAIR_CATS = ['Hair Brushes', 'Combs', 'Massagers'];
const secOf = p => Array.isArray(p.sections) ? p.sections : [p.bestSeller ? 'best' : null, p.group === 'bamboo' ? 'bamboo' : (p.group === 'sandalwood' || [p.cat, ...(p.featCats || [])].some(c => HAIR_CATS.includes(c))) ? 'sandalwood' : null].filter(Boolean);
const secFields = arr => ({ sections: arr, bestSeller: arr.includes('best'), group: arr.includes('sandalwood') ? 'sandalwood' : arr.includes('bamboo') ? 'bamboo' : 'other' });
const hideNote = p => (p.active === false ? 'লুকানো' : (+p.stock || 0) <= 0 ? 'স্টক শেষ' : '');
/* ---------- অটো বেস্ট সেলিং (কাস্টমারের অর্ডার থেকে) ---------- */
function bestRank() {
  const ab = D.settings.autoBest || {}, days = +ab.days || 0, since = days ? Date.now() - days * 864e5 : 0;
  const byId = new Map(D.products.map(p => [p.id, p])), byName = new Map(D.products.map(p => [String(p.name || '').trim().toLowerCase(), p]));
  const sold = {};
  D.orders.forEach(o => {
    if (o.status === 'cancelled') return;
    const t = o.createdAt?.toDate ? o.createdAt.toDate().getTime() : 0; if (since && t && t < since) return;
    (o.items || []).forEach(it => { const p = byId.get(it.pid) || byName.get(String(it.name || '').trim().toLowerCase()); if (p) sold[p.id] = (sold[p.id] || 0) + (+it.qty || 1); });
  });
  return Object.entries(sold).map(([id, q]) => ({ p: byId.get(id), q })).filter(x => x.p && x.p.active !== false && (+x.p.stock || 0) > 0).sort((x, y) => y.q - x.q || (x.p.name || '').localeCompare(y.p.name || ''));
}
async function autoBestRun(force) {
  const ab = D.settings.autoBest || {};
  if ((!ab.on && !force) || autoBusy || !firstLoad.orders || !firstLoad.products || !D.products.length) return;
  const n = Math.min(Math.max(+ab.count || 12, 1), 50), top = bestRank().slice(0, n).map(x => x.p), ids = new Set(top.map(p => p.id));
  const adds = top.filter(p => !secOf(p).includes('best') && !p.bestOff);
  const rms = D.products.filter(p => p.bestAuto && secOf(p).includes('best') && !ids.has(p.id));
  if (!adds.length && !rms.length) { if (force) toast('নতুন কিছু বদলানোর নেই — বেস্ট সেলিং আগে থেকেই আপ-টু-ডেট'); return; }
  autoBusy = true;
  try {
    const bt = writeBatch(db);
    adds.forEach(p => bt.update(doc(db, 'products', p.id), { ...secFields([...secOf(p).filter(x => x !== 'best'), 'best']), bestAuto: true }));
    rms.forEach(p => bt.update(doc(db, 'products', p.id), { ...secFields(secOf(p).filter(x => x !== 'best')), bestAuto: false }));
    await bt.commit(); toast('🔥 অটো বেস্ট সেলিং আপডেট হয়েছে (' + bn(adds.length) + 'টি যোগ, ' + bn(rms.length) + 'টি বাদ)');
  } catch (e) { toast('অটো আপডেট হয়নি: ' + e.code); } finally { autoBusy = false; }
}
function vAutoBest() {
  const ab = D.settings.autoBest || {}, top = bestRank().slice(0, 10);
  return `<div class="card p-3 mb-3"><h3 class="font-bold mb-1">🔥 অটো বেস্ট সেলিং (অর্ডার অনুযায়ী)</h3>
  <p class="text-xs text-black/60 mb-2">চালু করলে কাস্টমারের অর্ডার (বাতিল ছাড়া) থেকে সবচেয়ে বেশি বিক্রি হওয়া প্রোডাক্টগুলো নিজে থেকে "বেস্ট সেলিং"-এ যোগ হবে, আর তালিকা থেকে পড়ে গেলে অটো-যোগ হওয়াগুলো বাদ যাবে। আপনার হাতে যোগ করা প্রোডাক্ট কখনো অটো বাদ পড়বে না, আর হাতে বাদ দেওয়া প্রোডাক্ট অটো ফিরে আসবে না। এটি অ্যাডমিন প্যানেল খোলা থাকলে (নতুন অর্ডার এলেও) চলে।</p>
  <div class="flex flex-wrap items-center gap-3 text-sm"><label class="flex items-center gap-2"><input type="checkbox" id="abOn" ${ab.on ? 'checked' : ''}> চালু</label>
  <label class="flex items-center gap-2">কয়টি প্রোডাক্ট <input type="number" id="abCount" min="1" max="50" class="inp !w-20" value="${+ab.count || 12}"></label>
  <label class="flex items-center gap-2">সময় <select id="abDays" class="inp !w-auto">${[[7, 'শেষ ৭ দিন'], [30, 'শেষ ৩০ দিন'], [90, 'শেষ ৯০ দিন'], [0, 'সব সময়']].map(([v, t]) => `<option value="${v}" ${(ab.days === undefined ? 30 : +ab.days) === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
  <button class="btn" data-act="absave">সেভ</button><button class="btn2" data-act="abrun">এখনই আপডেট</button></div>
  <p class="text-xs font-bold mt-3 mb-1">এখন সবচেয়ে বেশি বিক্রি (সময়সীমা অনুযায়ী)</p>
  ${top.length ? `<ol class="text-sm list-decimal pl-5 space-y-0.5">${top.map(x => `<li>${esc(x.p.name)} <b>— ${bn(x.q)}টি</b></li>`).join('')}</ol>` : '<p class="text-xs text-black/50">এই সময়ে কোনো অর্ডার নেই</p>'}</div>`;
}
function vSections() {
  return `<p class="text-xs text-black/60 mb-3">ওয়েবসাইটের কোন সেকশনে কোন প্রোডাক্ট দেখাবে তা এখান থেকে যোগ বা বাদ দিন। একটি প্রোডাক্ট একাধিক সেকশনে রাখা যায়। (সেকশন থেকে বাদ দিলে প্রোডাক্ট ডিলিট হয় না।)</p>
  ${vAutoBest()}
  <div class="grid md:grid-cols-3 gap-3">${SECTIONS.map(([k, n]) => {
    const inS = D.products.filter(p => secOf(p).includes(k)).sort((x, y) => (x.name || '').localeCompare(y.name || ''));
    const out = D.products.filter(p => !secOf(p).includes(k)).sort((x, y) => (x.name || '').localeCompare(y.name || ''));
    return `<div class="card p-3"><div class="flex justify-between items-center mb-2 gap-2"><h3 class="font-bold">${n}</h3><span class="text-xs font-bold px-2 py-0.5 rounded-full bg-black/10 shrink-0">${bn(inS.length)}টি</span></div>
    <div class="max-h-96 overflow-y-auto">${inS.map(p => `<div class="flex items-center gap-2 py-1.5 border-b"><img src="${esc(p.images?.[0] || '')}" class="w-10 h-12 object-cover rounded bg-gray-100 shrink-0" alt=""><div class="flex-1 min-w-0"><p class="text-sm leading-snug">${esc(p.name)}${k === 'best' && p.bestAuto ? ' <span class="text-xs">🔥 অটো</span>' : ''}</p>${hideNote(p) ? `<p class="text-xs red font-bold">সাইটে দেখাচ্ছে না: ${hideNote(p)}</p>` : ''}</div><button class="btn2 red shrink-0" data-act="secrm" data-id="${p.id}" data-sec="${k}" aria-label="সেকশন থেকে বাদ দিন">✕</button></div>`).join('') || '<p class="text-sm text-black/50 py-2">এই সেকশনে কোনো প্রোডাক্ট নেই</p>'}</div>

async function migrateImages() {
  const todo = D.products.filter(p => (p.images || []).some(isData));
  if (!todo.length) return toast('সব ছবি আগে থেকেই লিংকে আছে ✅');
  if (!confirm(bn(todo.length) + 'টি প্রোডাক্টের পুরনো ছবি Cloudinary-তে সরানো হবে। পেজ বন্ধ করবেন না। শুরু করবেন?')) return;
  let done = 0, fail = 0, err = '';
  for (const p of todo) {
    try {
      const imgs = []; for (const src of p.images) imgs.push(isData(src) ? await uploadCld(src) : src);
      await updateDoc(doc(db, 'products', p.id), { images: imgs }); done++;
    } catch (e) { fail++; err = e.message; }
    toast('ছবি সরানো হচ্ছে… ' + bn(done + fail) + '/' + bn(todo.length));
  }
  toast(bn(done) + 'টি সরানো হয়েছে ✅' + (fail ? ` · ${bn(fail)}টি হয়নি: ${err}` : ''));
}

// অন্য সাইটের লিংক করা ছবি (যেমন ইমপোর্টের সময় আসা) নিজের Cloudinary-তে কপি করে; না পারলে আগের লিংকই থাকে
async function migrateExternal() {
  const todo = D.products.filter(p => (p.images || []).some(isExt));
  if (!todo.length) return toast('অন্য সাইটের কোনো ছবি নেই ✅');
  if (!confirm(bn(todo.length) + 'টি প্রোডাক্টের ছবি নিজের Cloudinary-তে আনা হবে। পেজ বন্ধ করবেন না। শুরু করবেন?')) return;
  let ok = 0, fail = 0, err = '', n = 0;
  for (const p of todo) {
    const imgs = []; let changed = false;
    for (const src of p.images) {
      if (!isExt(src)) { imgs.push(src); continue; }
      try { imgs.push(await uploadCld(src)); ok++; changed = true; } catch (e) { fail++; err = e.message; imgs.push(src); }
    }
    if (changed) { try { await updateDoc(doc(db, 'products', p.id), { images: imgs }); } catch (e) { err = e.code || e.message; } }
    toast('ছবি আনা হচ্ছে… ' + bn(++n) + '/' + bn(todo.length));
  }
  toast(bn(ok) + 'টি ছবি এসেছে ✅' + (fail ? ` · ${bn(fail)}টি আনা যায়নি (${err})` : ''), 6000);
}

};

// সার্চে প্রতিটা অক্ষরে পুরো পেজ নতুন করে আঁকলে ধীর হয় ও অক্ষর ডাবল হয়; তাই একটু থেমে একবার আপডেট, আর বাংলা/IME লেখার মাঝে নয়
window._comp = false;
document.addEventListener('compositionstart', () => { window._comp = true; });
document.addEventListener('compositionend', () => { window._comp = false; });
const deb = (key, fn, ms = 220) => { clearTimeout(window['_t' + key]); const run = () => { if (window._comp) window['_t' + key] = setTimeout(run, 200); else fn(); }; window['_t' + key] = setTimeout(run, ms); };
document.addEventListener('input', e => {
  const k = e.target.dataset.in;
  if (k === 'pname') { const f = $('#fBrand'); if (f && (!f.value.trim() || f.dataset.auto === '1')) { const b = detectBrand(e.target.value); f.value = b; f.dataset.auto = b ? '1' : ''; } }
  if (k === 'pbrand') e.target.dataset.auto = '';
  if (k === 'secq') { const sec = e.target.dataset.sec; secQ[sec] = e.target.value; deb('s' + sec, () => { const n0 = document.querySelector('[data-in=secq][data-sec="' + sec + '"]'), p = n0 ? n0.selectionStart : 0; render(); const n = document.querySelector('[data-in=secq][data-sec="' + sec + '"]'); if (n) { n.focus(); n.setSelectionRange(p, p); } }); }
  if (k === 'homeq') { const i = e.target.dataset.i; homeQ[i] = e.target.value; deb('h' + i, () => { const sel = '[data-in=homeq][data-i="' + i + '"]', n0 = document.querySelector(sel), p = n0 ? n0.selectionStart : 0; render(); const n = document.querySelector(sel); if (n) { n.focus(); n.setSelectionRange(p, p); } }); }
  if (k === 'psearch') { pSearch = e.target.value; deb('p', () => { const el = $('#plist'); if (el) el.innerHTML = vProducts(true); else render(); }); }
  if (k === 'osearch') { oSearch = e.target.value; deb('o', () => { const n0 = $('[data-in=osearch]'), p = n0 ? n0.selectionStart : 0; render(); const n = $('[data-in=osearch]'); if (n) { n.focus(); n.setSelectionRange(p, p); } }); }
});
document.addEventListener('change', async e => {
  const t = e.target, k = t.dataset.in;
  if (k === 'pimgs') {
    const files = [...t.files]; t.value = ''; let ok = 0, fail = '';
    for (const f of files) {
      if (form.images.length >= 15) break;
      toast('ছবি আপলোড হচ্ছে… (' + bn(ok + 1) + '/' + bn(Math.min(files.length, 15 - form.images.length + ok)) + ')');
      try { form.images.push(await uploadCld(f)); ok++; drawImgs(); } catch (er) { fail = er.message; }
    }
    drawImgs();
    toast(fail ? (ok ? bn(ok) + 'টি হয়েছে, বাকিগুলো হয়নি: ' : 'আপলোড হয়নি: ') + fail : bn(ok) + 'টি ছবি আপলোড হয়েছে ✅ (এখন "সেভ করুন" চাপুন)');
  }
  if (k === 'offimg') { const o = getOff(); for (const f of t.files) { if (o.sec.images.length >= 3) break; try { o.sec.images.push(await fileToData(f, 700, .8)); } catch { toast('ছবি পড়া যায়নি'); } } t.value = ''; render(); }
  if (k === 'badgeimg' && t.files[0]) { try { getOff().badge.image = await fileToPng(t.files[0]); } catch { toast('ছবি পড়া যায়নি'); } t.value = ''; render(); }
  if (k === 'banner' && t.files[0]) { toast('আপলোড হচ্ছে…'); try { await addDoc(collection(db, 'banners'), { image: await fileToData(t.files[0], 1400, .8), link: '', active: true, createdAt: serverTimestamp() }); toast('ব্যানার যোগ হয়েছে ✅'); } catch (er) { toast('আপলোড হয়নি: ' + er.code); } }
  if (k === 'popup' && t.files[0]) { toast('আপলোড হচ্ছে…'); try { await addDoc(collection(db, 'banners'), { image: await fileToData(t.files[0], 1000, .82), kind: 'popup', link: '', active: true, createdAt: serverTimestamp() }); toast('পপআপ এড যোগ হয়েছে ✅'); } catch (er) { toast('আপলোড হয়নি: ' + er.code); } }
  if (k === 'blink') updateDoc(doc(db, 'banners', t.dataset.id), { link: t.value.trim() });
  if (k === 'brandlogo' && t.files[0]) { const f = t.files[0], nm = t.dataset.brand; t.value = ''; toast('লোগো আপলোড হচ্ছে…'); try { const url = await uploadCld(f); await saveBrands(brandCfg().map(x => x.name === nm ? { ...x, logo: url } : x)); } catch (er) { toast('আপলোড হয়নি: ' + (er.message || er.code)); } }
  if (k === 'caticon' && t.files[0]) { const f = t.files[0], nm = t.dataset.cat; t.value = ''; toast('আইকন আপলোড হচ্ছে…'); try { const url = await uploadCld(f); await catPatch(nm, { icon: url }); } catch (er) { toast('আপলোড হয়নি: ' + (er.message || er.code)); } }
  if (k === 'pinpos') { const i = +t.dataset.i, j = +t.dataset.j; homeEdit(i, x => { const to = Math.min(Math.max(Math.round(+t.value) || 1, 1), x.pins.length) - 1; moveIn(x.pins, j, to); }); }
  if (k === 'homesub') homeEdit(+t.dataset.i, x => { x.sub = t.value.trim(); });
  if (k === 'seed') { const f = t.files[0]; t.value = ''; impStart(f); }
  if (k === 'impmode') { impMode = t.value; render(); }
  if (k === 'impupd') impUpdate = t.checked;
});
</script>
