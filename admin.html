<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Azaan Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans Bengali',system-ui,sans-serif;background:#f4f7ee;color:#14160f}
.inp{width:100%;border:1px solid #d4d8cc;border-radius:.6rem;padding:.55rem .75rem;background:#fff;font-size:.9rem}
.inp:focus{outline:2px solid #8dc63f;border-color:#8dc63f}
.btn{background:#8dc63f;color:#14160f;font-weight:700;border-radius:.6rem;padding:.55rem 1rem;font-size:.9rem}
.btn:hover{background:#14160f;color:#fff}.btn2{border:1px solid #c9cfbd;border-radius:.6rem;padding:.45rem .8rem;font-size:.85rem;background:#fff}
.btn2:hover{border-color:#14160f}.red{color:#b91c1c}.card{background:#fff;border:1px solid #e3e7da;border-radius:1rem}
.tab.on{background:#14160f;color:#fff}</style>
</head>
<body>
<div id="login" class="min-h-screen grid place-items-center p-4">
  <form id="loginForm" class="card p-6 w-full max-w-sm space-y-3">
    <h1 class="text-xl font-bold">Azaan এডমিন লগইন</h1>
    <input id="lEmail" type="email" class="inp" placeholder="ইমেইল" required autocomplete="username">
    <input id="lPass" type="password" class="inp" placeholder="পাসওয়ার্ড" required autocomplete="current-password">
    <p id="lErr" class="text-sm red"></p>
    <button class="btn w-full">লগইন</button>
  </form>
</div>

<div id="app" class="hidden">
  <header class="bg-white border-b sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-3 py-2 flex items-center gap-2">
      <b class="text-lg">Azaan Admin</b>
      <button data-act="sound" id="soundBtn" class="btn2 ml-auto">🔔 সাউন্ড বন্ধ</button>
      <button data-act="logout" class="btn2">লগআউট</button>
    </div>
    <nav id="tabs" class="max-w-6xl mx-auto px-3 pb-2 flex gap-2 overflow-x-auto text-sm font-semibold"></nav>
  </header>
  <main id="view" class="max-w-6xl mx-auto p-3 sm:p-4"></main>
</div>

<div id="modal" class="hidden fixed inset-0 z-50 bg-black/50 overflow-y-auto p-3"><div id="modalBox" class="card max-w-2xl mx-auto my-6 p-5"></div></div>
<div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-black text-white text-sm px-4 py-2 rounded-full z-[60]"></div>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, getDoc, query, orderBy, serverTimestamp, increment, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(window.FIREBASE_CONFIG), auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn = s => String(s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const tk = n => bn((+n || 0).toLocaleString('en-US')) + '৳';
const dt = t => t?.toDate ? t.toDate().toLocaleString('bn-BD', {dateStyle:'medium', timeStyle:'short'}) : '…';
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2500); };
const ST = { pending:['পেন্ডিং','bg-yellow-100 text-yellow-800'], confirmed:['কনফার্ম','bg-blue-100 text-blue-800'], shipped:['শিপড','bg-purple-100 text-purple-800'], delivered:['ডেলিভারড','bg-green-100 text-green-800'], cancelled:['ক্যান্সেল','bg-red-100 text-red-800'] };
const badge = s => `<span class="px-2 py-0.5 rounded-full text-xs font-bold ${ST[s]?.[1] || ''}">${ST[s]?.[0] || s}</span>`;
const TABS = [['dash','ড্যাশবোর্ড'],['products','প্রোডাক্ট'],['sections','ফিচারড সেকশন ও ক্যাটাগরি'],['catbrand','ক্যাটাগরি ও ব্র্যান্ড সাজান'],['orders','অর্ডার'],['customers','কাস্টমার'],['promos','প্রমো কোড'],['banners','ব্যানার'],['offers','অফার ও আইকন'],['popups','পপআপ এড'],['settings','সেটিংস']];

const D = { products:[], orders:[], promos:[], banners:[], settings:{} };
let tab = 'dash', oFilter = 'all', oSearch = '', pSearch = '', form = {}, soundOn = false, firstLoad = {}, unsubs = [];

/* ---------- Auth ---------- */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#lErr').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('#lEmail').value.trim(), $('#lPass').value); }
  catch { $('#lErr').textContent = 'ইমেইল বা পাসওয়ার্ড ভুল।'; }
});
onAuthStateChanged(auth, u => {
  $('#login').classList.toggle('hidden', !!u); $('#app').classList.toggle('hidden', !u);
  unsubs.forEach(f => f()); unsubs = []; firstLoad = {};
  if (u) { listen('products'); listen('orders', 'createdAt'); listen('promos'); listen('banners'); listenSettings(); }
});
function listen(name, ord) {
  const q = ord ? query(collection(db, name), orderBy(ord, 'desc')) : collection(db, name);
  unsubs.push(onSnapshot(q, s => {
    D[name] = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (name === 'orders' && firstLoad.orders && soundOn && s.docChanges().some(c => c.type === 'added')) { beep(); toast('🛒 নতুন অর্ডার এসেছে!'); }
    firstLoad[name] = true; if (name === 'products') { hadProducts ||= D.products.length > 0; schedSync(); } render();
  }, err => toast('ডাটা লোড হয়নি: ' + err.code)));
}
function listenSettings() { unsubs.push(onSnapshot(doc(db, 'settings', 'main'), s => { D.settings = s.data() || {}; syncBrands(); render(); })); }
function beep() { try { const c = new AudioContext(), o = c.createOscillator(); o.connect(c.destination); o.frequency.value = 880; o.start(); setTimeout(() => { o.stop(); c.close(); }, 350); } catch {} }

/* ---------- Image helper (ছবি ছোট করে Firestore এ রাখা হয়, আলাদা স্টোরেজ লাগে না) ---------- */
const fileToData = (f, max = 900, q = .8) => new Promise((ok, no) => {
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', q)); }; im.onerror = no; im.src = r.result; };
  r.onerror = no; r.readAsDataURL(f);
});

/* ---------- Cloudinary ছবি আপলোড (ছবি Cloudinary তে থাকে, ডাটাবেসে শুধু লিংক) ---------- */
const CLD = { cloud: 'vapfnr6g', preset: 'azaan_products' };
const toBlob = (f, max = 1200, q = .85) => new Promise((ok, no) => {
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); c.toBlob(b => b ? ok(b) : no(new Error('blob')), 'image/jpeg', q); }; im.onerror = no; im.src = r.result; };
  r.onerror = no; r.readAsDataURL(f);
});
async function uploadCld(file, tf = 'f_auto,q_auto,w_800') {
  const fd = new FormData(); fd.append('file', typeof file === 'string' ? file : await toBlob(file)); fd.append('upload_preset', CLD.preset);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLD.cloud}/image/upload`, { method: 'POST', body: fd });
  const j = await res.json(); if (!res.ok || !j.secure_url) throw new Error(j.error?.message || 'upload failed');
  return j.secure_url.replace('/upload/', '/upload/' + tf + '/');
}

/* ---------- Modal ---------- */
const openModal = h => { $('#modalBox').innerHTML = h; $('#modal').classList.remove('hidden'); };
const closeModal = () => $('#modal').classList.add('hidden');
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });

/* ---------- Views ---------- */
function render() {
  $('#tabs').innerHTML = TABS.map(([k, n]) => `<button data-act="tab" data-v="${k}" class="tab shrink-0 px-3 py-1.5 rounded-full border bg-white ${tab === k ? 'on' : ''}">${n}${k === 'orders' && D.orders.filter(o => o.status === 'pending').length ? ` (${bn(D.orders.filter(o => o.status === 'pending').length)})` : ''}</button>`).join('');
  $('#view').innerHTML = ({ dash: vDash, products: vProducts, sections: vSections, catbrand: vCatBrand, orders: vOrders, customers: vCustomers, promos: vPromos, banners: vBanners, offers: vOffers, popups: vPopups, settings: vSettings })[tab]();
}
function vDash() {
  const today = new Date().toDateString(), live = D.orders.filter(o => o.status !== 'cancelled');
  const tod = D.orders.filter(o => o.createdAt?.toDate && o.createdAt.toDate().toDateString() === today);
  const low = D.products.filter(p => p.active !== false && (+p.stock || 0) <= 5);
  const box = (t, v) => `<div class="card p-4"><p class="text-xs text-black/60">${t}</p><p class="text-2xl font-bold mt-1">${v}</p></div>`;
  return `<div class="grid grid-cols-2 md:grid-cols-4 gap-3">
    ${box('আজকের অর্ডার', bn(tod.length))}${box('আজকের বিক্রি', tk(tod.filter(o => o.status !== 'cancelled').reduce((a, o) => a + o.total, 0)))}
    ${box('পেন্ডিং অর্ডার', bn(D.orders.filter(o => o.status === 'pending').length))}${box('মোট বিক্রি', tk(live.reduce((a, o) => a + o.total, 0)))}</div>
  <div class="grid md:grid-cols-2 gap-3 mt-3">
    <div class="card p-4"><h3 class="font-bold mb-2">সর্বশেষ অর্ডার</h3>${D.orders.slice(0, 6).map(o => `<button data-act="order" data-id="${o.id}" class="w-full flex justify-between items-center py-2 border-b text-left text-sm"><span>${esc(o.orderNo)} · ${esc(o.name)}</span><span>${tk(o.total)} ${badge(o.status)}</span></button>`).join('') || '<p class="text-sm text-black/50">এখনো অর্ডার নেই</p>'}</div>
    <div class="card p-4"><h3 class="font-bold mb-2">স্টক কম (৫ বা কম)</h3>${low.map(p => `<button data-act="pedit" data-id="${p.id}" class="w-full flex justify-between py-2 border-b text-sm text-left"><span>${esc(p.name)}</span><b class="${+p.stock <= 0 ? 'red' : ''}">${bn(+p.stock || 0)}</b></button>`).join('') || '<p class="text-sm text-black/50">সব প্রোডাক্টের স্টক ঠিক আছে</p>'}</div>
  </div>`;
}
/* ---------- ওয়েবসাইটের ফিচারড সেকশন ---------- */
const SECTIONS = [['best', '★ বেস্ট সেলিং প্রোডাক্টস', '★ বেস্ট'], ['sandalwood', 'চন্দন কালেকশন (Sandalwood)', 'চন্দন'], ['bamboo', 'বাম্বু কালেকশন (Bamboo Wood)', 'বাম্বু']];
const HAIR_CATS = ['Hair Brushes', 'Combs', 'Massagers'];
const secOf = p => Array.isArray(p.sections) ? p.sections : [p.bestSeller ? 'best' : null, p.group === 'bamboo' ? 'bamboo' : (p.group === 'sandalwood' || [p.cat, ...(p.featCats || [])].some(c => HAIR_CATS.includes(c))) ? 'sandalwood' : null].filter(Boolean);
const secFields = arr => ({ sections: arr, bestSeller: arr.includes('best'), group: arr.includes('sandalwood') ? 'sandalwood' : arr.includes('bamboo') ? 'bamboo' : 'other' });
const hideNote = p => (p.active === false ? 'লুকানো' : (+p.stock || 0) <= 0 ? 'স্টক শেষ' : '');
function vSections() {
  return `<p class="text-xs text-black/60 mb-3">ওয়েবসাইটের কোন সেকশনে কোন প্রোডাক্ট দেখাবে তা এখান থেকে যোগ বা বাদ দিন। একটি প্রোডাক্ট একাধিক সেকশনে রাখা যায়। (সেকশন থেকে বাদ দিলে প্রোডাক্ট ডিলিট হয় না।)</p>
  <div class="grid md:grid-cols-3 gap-3">${SECTIONS.map(([k, n]) => {
    const inS = D.products.filter(p => secOf(p).includes(k)).sort((x, y) => (x.name || '').localeCompare(y.name || ''));
    const out = D.products.filter(p => !secOf(p).includes(k)).sort((x, y) => (x.name || '').localeCompare(y.name || ''));
    return `<div class="card p-3"><div class="flex justify-between items-center mb-2 gap-2"><h3 class="font-bold">${n}</h3><span class="text-xs font-bold px-2 py-0.5 rounded-full bg-black/10 shrink-0">${bn(inS.length)}টি</span></div>
    <div class="max-h-96 overflow-y-auto">${inS.map(p => `<div class="flex items-center gap-2 py-1.5 border-b"><img src="${esc(p.images?.[0] || '')}" class="w-10 h-12 object-cover rounded bg-gray-100 shrink-0" alt=""><div class="flex-1 min-w-0"><p class="text-sm leading-snug">${esc(p.name)}</p>${hideNote(p) ? `<p class="text-xs red font-bold">সাইটে দেখাচ্ছে না: ${hideNote(p)}</p>` : ''}</div><button class="btn2 red shrink-0" data-act="secrm" data-id="${p.id}" data-sec="${k}" aria-label="সেকশন থেকে বাদ দিন">✕</button></div>`).join('') || '<p class="text-sm text-black/50 py-2">এই সেকশনে কোনো প্রোডাক্ট নেই</p>'}</div>
    ${out.length ? `<div class="flex gap-2 mt-3"><select id="add-${k}" class="inp"><option value="">প্রোডাক্ট বেছে নিন…</option>${out.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><button class="btn shrink-0" data-act="secadd" data-sec="${k}">+ যোগ</button></div>` : '<p class="text-xs text-black/50 mt-3">সব প্রোডাক্টই এই সেকশনে আছে</p>'}</div>`;
  }).join('')}</div>
  ${vCats()}`;
}
async function setSections(p, arr) {
  try { await updateDoc(doc(db, 'products', p.id), secFields(arr)); toast('সেকশন আপডেট হয়েছে ✅'); } catch (e) { toast('আপডেট হয়নি: ' + e.code); }
}

/* ---------- ফিচারড ক্যাটাগরি (ওয়েবসাইটের গোল আইকনগুলো) ---------- */
const BRANDS = [['Centella', ['centella']], ['Raip', ['raip', 'r3']], ['Daboo', ['daboo', 'dabo']], ['Skino', ['skino', 'skin o', 'skin-o']], ['XHC', ['xhc', 'xpel hair care']]];
const canonBrand = t => { const k = String(t || '').trim().toLowerCase(); const b = BRANDS.find(([n, al]) => n.toLowerCase() === k || al.includes(k)); return b ? b[0] : String(t || '').trim(); };
const detectBrand = name => { const k = ' ' + String(name || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ') + ' '; const b = BRANDS.find(([n, al]) => al.some(a => k.includes(' ' + a + ' ') || (a.length > 3 && k.includes(a)))); return b ? b[0] : ''; };
const BASE_CATS = ['Hair Brushes', 'Combs', 'Massagers', 'Face', 'Lip', 'Hair', 'Bath & Body', 'Eye', 'Makeup', 'Fragrance', 'K-Beauty', 'Pharmacy Items'];
const catsOf = p => Array.isArray(p.featCats) ? p.featCats : (p.cat ? [p.cat] : []);
const customCats = () => Array.isArray(D.settings.customCats) ? D.settings.customCats : [];
const allCats = () => [...new Set([...BASE_CATS, ...customCats(), ...D.products.flatMap(catsOf)])];
function vCats() {
  const byName = (x, y) => (x.name || '').localeCompare(y.name || '');
  return `<h2 class="font-bold text-lg mt-8 mb-1">ফিচারড ক্যাটাগরি (ওয়েবসাইটের গোল আইকন)</h2>
  <p class="text-xs text-black/60 mb-3">ওয়েবসাইটের "Featured Categories" এর প্রতিটি আইকনে কোন কোন প্রোডাক্ট থাকবে তা এখান থেকে যোগ বা বাদ দিন। একটি প্রোডাক্ট একাধিক ক্যাটাগরিতে রাখা যায়। ক্যাটাগরিতে কোনো প্রোডাক্ট না থাকলে আইকনটি সাইটে দেখাবে না। (বাদ দিলে প্রোডাক্ট ডিলিট হয় না।)</p>
  <div class="card p-3 mb-3 flex gap-2"><input id="newCat" class="inp" maxlength="30" placeholder="নতুন ক্যাটাগরির নাম (ইংরেজিতে, যেমন: Hair Oil)"><button class="btn shrink-0" data-act="catnew">+ নতুন ক্যাটাগরি</button></div>
  <div class="grid md:grid-cols-3 gap-3">${allCats().map((k, i) => {
    const inC = D.products.filter(p => catsOf(p).includes(k)).sort(byName);
    const out = D.products.filter(p => !catsOf(p).includes(k)).sort(byName);
    const isCustom = customCats().includes(k) && !inC.length;
    return `<div class="card p-3"><div class="flex justify-between items-center mb-2 gap-2"><h3 class="font-bold break-words min-w-0">${esc(k)}</h3><span class="text-xs font-bold px-2 py-0.5 rounded-full bg-black/10 shrink-0">${bn(inC.length)}টি</span></div>
    <div class="max-h-96 overflow-y-auto">${inC.map(p => `<div class="flex items-center gap-2 py-1.5 border-b"><img src="${esc(p.images?.[0] || '')}" class="w-10 h-12 object-cover rounded bg-gray-100 shrink-0" alt=""><div class="flex-1 min-w-0"><p class="text-sm leading-snug">${esc(p.name)}</p>${hideNote(p) ? `<p class="text-xs red font-bold">সাইটে দেখাচ্ছে না: ${hideNote(p)}</p>` : ''}</div><button class="btn2 red shrink-0" data-act="catrm" data-id="${p.id}" data-cat="${esc(k)}" aria-label="ক্যাটাগরি থেকে বাদ দিন">✕</button></div>`).join('') || '<p class="text-sm text-black/50 py-2">এই ক্যাটাগরিতে কোনো প্রোডাক্ট নেই (সাইটে আইকন দেখাবে না)</p>'}</div>
    ${out.length ? `<div class="flex gap-2 mt-3"><select id="cadd-${i}" class="inp"><option value="">প্রোডাক্ট বেছে নিন…</option>${out.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><button class="btn shrink-0" data-act="catadd" data-i="${i}" data-cat="${esc(k)}">+ যোগ</button></div>` : '<p class="text-xs text-black/50 mt-3">সব প্রোডাক্টই এই ক্যাটাগরিতে আছে</p>'}
    ${isCustom ? `<button class="btn2 red w-full mt-3" data-act="catdelete" data-cat="${esc(k)}">এই ক্যাটাগরি মুছুন</button>` : ''}</div>`;
  }).join('')}</div>`;
}
async function setCats(p, arr) {
  try { await updateDoc(doc(db, 'products', p.id), { featCats: arr }); toast('ক্যাটাগরি আপডেট হয়েছে ✅'); } catch (e) { toast('আপডেট হয়নি: ' + e.code); }
}

function vProducts() {
  const q = pSearch.toLowerCase(), list = D.products.filter(p => !q || (p.name + p.cat).toLowerCase().includes(q)).sort((a, b) => (a.name || '').localeCompare(b.name || ''));

  catadd: b => { const k = b.dataset.cat, id = $('#cadd-' + b.dataset.i)?.value; if (!id) return toast('আগে প্রোডাক্ট বেছে নিন'); const p = D.products.find(x => x.id === id); if (p) setCats(p, [...catsOf(p).filter(x => x !== k), k]); },
  catrm: b => { const p = D.products.find(x => x.id === b.dataset.id); if (p) setCats(p, catsOf(p).filter(x => x !== b.dataset.cat)); },
  catnew: async () => {
    const n = $('#newCat').value.trim().replace(/\s+/g, ' ');
    if (!n) return toast('ক্যাটাগরির নাম লিখুন');
    if (allCats().some(x => x.toLowerCase() === n.toLowerCase())) return toast('এই নামে ক্যাটাগরি আগে থেকেই আছে');
    try { await setDoc(doc(db, 'settings', 'main'), { customCats: [...customCats(), n] }, { merge: true }); toast('ক্যাটাগরি যোগ হয়েছে ✅ এখন প্রোডাক্ট যোগ করুন'); } catch (e) { toast('যোগ হয়নি: ' + e.code); }
  },
  catdelete: async b => { if (!confirm('এই ক্যাটাগরি মুছবেন?')) return; try { await setDoc(doc(db, 'settings', 'main'), { customCats: customCats().filter(x => x !== b.dataset.cat) }, { merge: true }); toast('মুছে ফেলা হয়েছে'); } catch (e) { toast('মোছা হয়নি: ' + e.code); } },
  offrm: b => { getOff().sec.images.splice(+b.dataset.i, 1); render(); },
  badgerm: () => { getOff().badge.image = ''; render(); },
  offsave: async () => {
    const o = getOff();
    try { await setDoc(doc(db, 'settings', 'main'), { offerSec: o.sec, offerBadge: o.badge, showDisc: o.showDisc }, { merge: true }); offDraft = null; toast('অফার সেটিংস সেভ হয়েছে ✅'); } catch (e) { toast('সেভ হয়নি: ' + e.code); }
  },
  offreset: async () => {
    if (!confirm('অফার সেকশন ও ব্যাজ আগের ডিফল্টে ফিরিয়ে নেবেন?')) return;
    try { await setDoc(doc(db, 'settings', 'main'), { offerSec: {}, offerBadge: {}, showDisc: true }, { merge: true }); await updateDoc(doc(db, 'settings', 'main'), { offerSec: {}, offerBadge: {} }); offDraft = null; render(); toast('ডিফল্টে ফিরেছে ✅'); } catch (e) { toast('হয়নি: ' + e.code); }
  },
  pickbrand: b => { const f = $('#fBrand'); f.value = b.dataset.brand; f.dataset.auto = ''; },
  pickcat: b => {
    const k = b.dataset.cat; $('#fCat').value = k;
    const cb = [...document.querySelectorAll('[data-catchk]')].find(x => x.dataset.catchk === k); if (cb) cb.checked = true;
  },
  rmimg: b => { form.images.splice(+b.dataset.i, 1); drawImgs(); },
  mainimg: b => { const [x] = form.images.splice(+b.dataset.i, 1); form.images.unshift(x); drawImgs(); },
  psave: async () => {
    const secs = [...document.querySelectorAll('[data-secchk]:checked')].map(x => x.dataset.secchk);
    const fcats = [...document.querySelectorAll('[data-catchk]:checked')].map(x => x.dataset.catchk), newCat = $('#fCat').value.trim();
    if (!form.id && newCat && !fcats.includes(newCat)) fcats.push(newCat);
    const d = { name: $('#fName').value.trim(), brand: canonBrand($('#fBrand').value) || detectBrand($('#fName').value), cat: $('#fCat').value.trim(), ...secFields(secs), featCats: fcats, regular: +$('#fReg').value, offer: +$('#fOff').value, stock: +$('#fStock').value || 0, desc: $('#fDesc').value.trim(), active: $('#fActive').checked, images: form.images };
    if (!d.name || !d.offer) return toast('নাম ও অফার দাম দিন');
    if (!d.regular) d.regular = d.offer;
    if (d.images.join('').length > 950000) return toast('ছবির সাইজ বেশি, কয়েকটি ছবি বাদ দিন');
    try { form.id ? await updateDoc(doc(db, 'products', form.id), d) : await addDoc(collection(db, 'products'), { ...d, createdAt: serverTimestamp() }); closeModal(); toast('সেভ হয়েছে ✅'); } catch (e) { toast('সেভ হয়নি: ' + e.code); }
  },
  syncnow: () => { if (!firstLoad.products) return toast('ডাটা লোড হচ্ছে, একটু পরে চেষ্টা করুন'); syncCatalog(true); },
  migimgs: migrateImages,
  catup: b => { const r = swapRows(catRows(), +b.dataset.i, -1); if (r) saveCatRows(r); },
  catdn: b => { const r = swapRows(catRows(), +b.dataset.i, 1); if (r) saveCatRows(r); },
  cathide: b => { const r = catRows(), x = r[+b.dataset.i]; x.hidden = !x.hidden; saveCatRows(r); },
  caticonrm: b => { const r = catRows(); r[+b.dataset.i].icon = ''; saveCatRows(r); },
  brandup: b => { const r = swapRows(brandRows(), +b.dataset.i, -1); if (r) saveBrandRows(r); },
  branddn: b => { const r = swapRows(brandRows(), +b.dataset.i, 1); if (r) saveBrandRows(r); },
  brandhide: b => { const r = brandRows(), x = r[+b.dataset.i]; x.hidden = !x.hidden; saveBrandRows(r); },
  brandlogorm: b => { const r = brandRows(); r[+b.dataset.i].logo = ''; saveBrandRows(r); },
  branddel: b => { const r = brandRows(), x = r[+b.dataset.i]; if (!confirm(x.name + ' ব্র্যান্ডটি মুছবেন? (প্রোডাক্ট ডিলিট হবে না)')) return; saveBrandRows(r.filter(y => y !== x)); },
  brandnew: () => { const n = $('#newBrand').value.trim().replace(/\s+/g, ' '); if (!n) return toast('ব্র্যান্ডের নাম লিখুন'); const r = brandRows(); if (r.some(x => x.name.toLowerCase() === n.toLowerCase())) return toast('এই নামে ব্র্যান্ড আগে থেকেই আছে'); r.push({ name: n, aliases: [n.toLowerCase()], logo: '', hidden: false }); saveBrandRows(r); },
  heroimgrm: b => saveHero(b.dataset.slide, +b.dataset.i, ''),
  catmerge: mergeCats,
  aliasrm: async b => { const a = { ...catAlias() }; delete a[b.dataset.from]; try { await setDoc(doc(db, 'settings', 'main'), { catAlias: a }); } catch (e) { return toast('হয়নি: ' + (e.code || e.message)); } toast('নিয়মটি তোলা হয়েছে'); },
  impgo: impRun,
  impsample: impSample,
  order: b => orderModal(D.orders.find(o => o.id === b.dataset.id)),
  ofilter: b => { oFilter = b.dataset.v; render(); },
  custorders: b => { oSearch = b.dataset.v; oFilter = 'all'; tab = 'orders'; render(); },
  osave: async b => {
    const o = D.orders.find(x => x.id === b.dataset.id), st = $('#oStatus').value, batch = writeBatch(db), upd = { status: st, adminNote: $('#oNote').value.trim() };
    const move = (sign) => (o.items || []).forEach(i => i.pid && batch.update(doc(db, 'products', i.pid), { stock: increment(sign * i.qty) }));
    if (st === 'confirmed' || st === 'shipped' || st === 'delivered') { if (!o.stockAdj) { move(-1); upd.stockAdj = true; } }
    else if (st === 'cancelled' && o.stockAdj) { move(1); upd.stockAdj = false; }
    batch.update(doc(db, 'orders', o.id), upd);
    try { await batch.commit(); closeModal(); toast('অর্ডার আপডেট হয়েছে ✅'); } catch (e) { toast('আপডেট হয়নি: ' + e.code); }
  },
  odel: async b => { if (confirm('অর্ডারটি পুরোপুরি ডিলিট করবেন?')) { await deleteDoc(doc(db, 'orders', b.dataset.id)); closeModal(); } },
  invoice: b => invoice(D.orders.find(o => o.id === b.dataset.id)),
  prnew: () => promoForm(),
  predit: b => promoForm(D.promos.find(p => p.id === b.dataset.id)),
  prdel: async b => { if (confirm('প্রমো কোড ডিলিট করবেন?')) await deleteDoc(doc(db, 'promos', b.dataset.id)); },
  prsave: async () => {
    const code = $('#prCode').value.trim().toUpperCase(), v = +$('#prVal').value;
    if (!/^[A-Z0-9_-]{3,20}$/.test(code) || !v) return toast('সঠিক কোড (ইংরেজি/সংখ্যা) ও ছাড়ের পরিমাণ দিন');
    const old = D.promos.find(p => p.id === code);
    await setDoc(doc(db, 'promos', code), { type: $('#prType').value, value: v, minOrder: +$('#prMin').value || 0, expiry: $('#prExp').value, maxUses: +$('#prMax').value || 0, active: $('#prActive').checked, used: old?.used || 0 });
    closeModal(); toast('সেভ হয়েছে ✅');
  },
  btoggle: b => updateDoc(doc(db, 'banners', b.dataset.id), { active: D.banners.find(x => x.id === b.dataset.id).active === false }),
  bdel: async b => { if (confirm('ব্যানার ডিলিট করবেন?')) await deleteDoc(doc(db, 'banners', b.dataset.id)); },
  ssave: async () => {
    const s = {}; document.querySelectorAll('[data-s]').forEach(i => { s[i.dataset.s] = i.type === 'number' ? +i.value : i.value.trim(); });
    await setDoc(doc(db, 'settings', 'main'), s, { merge: true }); toast('সেটিংস সেভ হয়েছে ✅');
  },
  passchg: async () => { const p = $('#newPass').value; if (p.length < 8) return toast('কমপক্ষে ৮ অক্ষর দিন'); try { await updatePassword(auth.currentUser, p); toast('পাসওয়ার্ড বদলেছে ✅'); $('#newPass').value = ''; } catch { toast('লগআউট করে আবার লগইন করে চেষ্টা করুন'); } }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && A[b.dataset.act]) A[b.dataset.act](b); });
const setOffPath = e => {
  const p = e.target.dataset.off; if (!p) return;
  const o = getOff(), v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (p === 'showDisc') o.showDisc = v; else { const [a, k] = p.split('.'); o[a][k] = v; }
};
document.addEventListener('input', setOffPath); document.addEventListener('change', setOffPath);
document.addEventListener('input', e => {
  const k = e.target.dataset.in;
  if (k === 'pname') { const f = $('#fBrand'); if (f && (!f.value.trim() || f.dataset.auto === '1')) { const b = detectBrand(e.target.value); f.value = b; f.dataset.auto = b ? '1' : ''; } }
  if (k === 'pbrand') e.target.dataset.auto = '';
  if (k === 'psearch') { pSearch = e.target.value; const p = e.target.selectionStart; render(); const n = $('[data-in=psearch]'); n.focus(); n.setSelectionRange(p, p); }
  if (k === 'osearch') { oSearch = e.target.value; const p = e.target.selectionStart; render(); const n = $('[data-in=osearch]'); n.focus(); n.setSelectionRange(p, p); }
});
document.addEventListener('change', async e => {
  const t = e.target, k = t.dataset.in;
  if (k === 'pimgs') {
    const files = [...t.files]; t.value = ''; let ok = 0, fail = '';
    for (const f of files) {
      if (form.images.length >= 5) break;
      toast('ছবি আপলোড হচ্ছে… (' + bn(ok + 1) + '/' + bn(Math.min(files.length, 5 - form.images.length + ok)) + ')');
      try { form.images.push(await uploadCld(f)); ok++; drawImgs(); } catch (er) { fail = er.message; }
    }
    drawImgs();
    toast(fail ? (ok ? bn(ok) + 'টি হয়েছে, বাকিগুলো হয়নি: ' : 'আপলোড হয়নি: ') + fail : bn(ok) + 'টি ছবি আপলোড হয়েছে ✅ (এখন "সেভ করুন" চাপুন)');
  }
  if (k === 'offimg') { const o = getOff(); for (const f of t.files) { if (o.sec.images.length >= 3) break; try { o.sec.images.push(await fileToData(f, 700, .8)); } catch { toast('ছবি পড়া যায়নি'); } } t.value = ''; render(); }
  if (k === 'badgeimg' && t.files[0]) { try { getOff().badge.image = await fileToPng(t.files[0]); } catch { toast('ছবি পড়া যায়নি'); } t.value = ''; render(); }
  if (k === 'banner' && t.files[0]) { toast('আপলোড হচ্ছে…'); try { await addDoc(collection(db, 'banners'), { image: await fileToData(t.files[0], 1400, .8), link: '', active: true, createdAt: serverTimestamp() }); toast('ব্যানার যোগ হয়েছে ✅'); } catch (er) { toast('আপলোড হয়নি: ' + er.code); } }
  if (k === 'popup' && t.files[0]) { toast('আপলোড হচ্ছে…'); try { await addDoc(collection(db, 'banners'), { image: await fileToData(t.files[0], 1000, .82), kind: 'popup', link: '', active: true, createdAt: serverTimestamp() }); toast('পপআপ এড যোগ হয়েছে ✅'); } catch (er) { toast('আপলোড হয়নি: ' + er.code); } }
  if (k === 'blink') updateDoc(doc(db, 'banners', t.dataset.id), { link: t.value.trim() });
  if (k === 'caticon' && t.files[0]) { const i = +t.dataset.i, f = t.files[0]; t.value = ''; toast('আইকন আপলোড হচ্ছে…'); try { const url = await uploadCld(f, 'f_auto,q_auto,w_240,h_240,c_fill'); const r = catRows(); r[i].icon = url; await saveCatRows(r); } catch (er) { toast('আপলোড হয়নি: ' + er.message); } }
  if (k === 'brandlogo' && t.files[0]) { const i = +t.dataset.i, f = t.files[0]; t.value = ''; toast('লোগো আপলোড হচ্ছে…'); try { const url = await uploadCld(f, 'f_auto,q_auto,w_320,c_fit'); const r = brandRows(); r[i].logo = url; await saveBrandRows(r); } catch (er) { toast('আপলোড হয়নি: ' + er.message); } }
  if (k === 'heroimg' && t.files[0]) { const sl = t.dataset.slide, i = +t.dataset.i, f = t.files[0]; t.value = ''; toast('ছবি আপলোড হচ্ছে…'); try { await saveHero(sl, i, await uploadCld(f, 'f_auto,q_auto,w_600')); } catch (er) { toast('আপলোড হয়নি: ' + er.message); } }
  if (k === 'seed') { const f = t.files[0]; t.value = ''; impStart(f); }
  if (k === 'impmode') { impMode = t.value; render(); }
  if (k === 'impupd') impUpdate = t.checked;
});
</script>
</body>
</html>
